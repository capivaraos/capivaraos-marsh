<?xml version="1.0" encoding="UTF-8"?>
<!-- Item de lista/menu do CapivaraOS — FrameSvg com prefixos de estado.
     normal = transparente; hover = accent suave; selected/pressed = accent sólido
     (texto branco vem do esquema de cores). Realce verde da marca = identidade.
     Retângulo arredondado r=6, preenchimento chapado (sem borda). FEAT-91 D4 (prova 2).
     IMPORTANTE: o fill vai EXPLÍCITO em cada forma (o QSvg do Plasma não herda o
     fill do <g> ancestral ao desenhar um elemento por id — só o transform).
     SPDX-License-Identifier: GPL-3.0-or-later
     SPDX-FileCopyrightText: 2026 CapivaraOS Project -->
<svg xmlns="http://www.w3.org/2000/svg" width="176" height="48" viewBox="0 0 176 48">
  <!-- normal: sem realce (transparente) -->
  <g transform="translate(0,0)">
    <path id="normal-topleft" d="M8,0 L6,0 A6,6 0 0 1 0,6 L0,8 L8,8 Z" fill="#15B22C" fill-opacity="0"/>
    <rect id="normal-top" x="12" y="0" width="4" height="8" fill="#15B22C" fill-opacity="0"/>
    <path id="normal-topright" d="M20,0 L22,0 A6,6 0 0 1 28,6 L28,8 L20,8 Z" fill="#15B22C" fill-opacity="0"/>
    <rect id="normal-left" x="0" y="12" width="8" height="4" fill="#15B22C" fill-opacity="0"/>
    <rect id="normal-center" x="12" y="12" width="4" height="4" fill="#15B22C" fill-opacity="0"/>
    <rect id="normal-right" x="20" y="12" width="8" height="4" fill="#15B22C" fill-opacity="0"/>
    <path id="normal-bottomleft" d="M0,20 L8,20 L8,28 L6,28 A6,6 0 0 1 0,22 Z" fill="#15B22C" fill-opacity="0"/>
    <rect id="normal-bottom" x="12" y="20" width="4" height="8" fill="#15B22C" fill-opacity="0"/>
    <path id="normal-bottomright" d="M20,20 L28,20 L28,22 A6,6 0 0 1 22,28 L20,28 Z" fill="#15B22C" fill-opacity="0"/>
  </g>
  <!-- hover: accent suave -->
  <g transform="translate(40,0)">
    <path id="hover-topleft" d="M8,0 L6,0 A6,6 0 0 1 0,6 L0,8 L8,8 Z" fill="#15B22C" fill-opacity="0.18"/>
    <rect id="hover-top" x="12" y="0" width="4" height="8" fill="#15B22C" fill-opacity="0.18"/>
    <path id="hover-topright" d="M20,0 L22,0 A6,6 0 0 1 28,6 L28,8 L20,8 Z" fill="#15B22C" fill-opacity="0.18"/>
    <rect id="hover-left" x="0" y="12" width="8" height="4" fill="#15B22C" fill-opacity="0.18"/>
    <rect id="hover-center" x="12" y="12" width="4" height="4" fill="#15B22C" fill-opacity="0.18"/>
    <rect id="hover-right" x="20" y="12" width="8" height="4" fill="#15B22C" fill-opacity="0.18"/>
    <path id="hover-bottomleft" d="M0,20 L8,20 L8,28 L6,28 A6,6 0 0 1 0,22 Z" fill="#15B22C" fill-opacity="0.18"/>
    <rect id="hover-bottom" x="12" y="20" width="4" height="8" fill="#15B22C" fill-opacity="0.18"/>
    <path id="hover-bottomright" d="M20,20 L28,20 L28,22 A6,6 0 0 1 22,28 L20,28 Z" fill="#15B22C" fill-opacity="0.18"/>
  </g>
  <!-- selected: accent sólido -->
  <g transform="translate(80,0)">
    <path id="selected-topleft" d="M8,0 L6,0 A6,6 0 0 1 0,6 L0,8 L8,8 Z" fill="#15B22C"/>
    <rect id="selected-top" x="12" y="0" width="4" height="8" fill="#15B22C"/>
    <path id="selected-topright" d="M20,0 L22,0 A6,6 0 0 1 28,6 L28,8 L20,8 Z" fill="#15B22C"/>
    <rect id="selected-left" x="0" y="12" width="8" height="4" fill="#15B22C"/>
    <rect id="selected-center" x="12" y="12" width="4" height="4" fill="#15B22C"/>
    <rect id="selected-right" x="20" y="12" width="8" height="4" fill="#15B22C"/>
    <path id="selected-bottomleft" d="M0,20 L8,20 L8,28 L6,28 A6,6 0 0 1 0,22 Z" fill="#15B22C"/>
    <rect id="selected-bottom" x="12" y="20" width="4" height="8" fill="#15B22C"/>
    <path id="selected-bottomright" d="M20,20 L28,20 L28,22 A6,6 0 0 1 22,28 L20,28 Z" fill="#15B22C"/>
  </g>
  <!-- pressed: accent escuro -->
  <g transform="translate(120,0)">
    <path id="pressed-topleft" d="M8,0 L6,0 A6,6 0 0 1 0,6 L0,8 L8,8 Z" fill="#0E7A1E"/>
    <rect id="pressed-top" x="12" y="0" width="4" height="8" fill="#0E7A1E"/>
    <path id="pressed-topright" d="M20,0 L22,0 A6,6 0 0 1 28,6 L28,8 L20,8 Z" fill="#0E7A1E"/>
    <rect id="pressed-left" x="0" y="12" width="8" height="4" fill="#0E7A1E"/>
    <rect id="pressed-center" x="12" y="12" width="4" height="4" fill="#0E7A1E"/>
    <rect id="pressed-right" x="20" y="12" width="8" height="4" fill="#0E7A1E"/>
    <path id="pressed-bottomleft" d="M0,20 L8,20 L8,28 L6,28 A6,6 0 0 1 0,22 Z" fill="#0E7A1E"/>
    <rect id="pressed-bottom" x="12" y="20" width="4" height="8" fill="#0E7A1E"/>
    <path id="pressed-bottomright" d="M20,20 L28,20 L28,22 A6,6 0 0 1 22,28 L20,28 Z" fill="#0E7A1E"/>
  </g>
  <rect id="hint-top-margin" x="0" y="40" width="4" height="4" fill="#000" fill-opacity="0"/>
  <rect id="hint-bottom-margin" x="6" y="40" width="4" height="4" fill="#000" fill-opacity="0"/>
  <rect id="hint-left-margin" x="12" y="40" width="5" height="4" fill="#000" fill-opacity="0"/>
  <rect id="hint-right-margin" x="20" y="40" width="5" height="4" fill="#000" fill-opacity="0"/>
</svg>
