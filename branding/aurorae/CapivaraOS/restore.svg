<svg xmlns="http://www.w3.org/2000/svg" width="140" height="16" viewBox="0 0 140 16">
  <g id="active-center" transform="translate(0,0)">
    <rect width="16" height="16" fill="#000" fill-opacity="0"/>
    <circle cx="8" cy="8" r="6" fill="#15B22C"/>
  </g>
  <g id="inactive-center" transform="translate(20,0)">
    <rect width="16" height="16" fill="#000" fill-opacity="0"/>
    <circle cx="8" cy="8" r="6" fill="#4A5040"/>
  </g>
  <g id="hover-center" transform="translate(40,0)">
    <rect width="16" height="16" fill="#000" fill-opacity="0"/>
    <circle cx="8" cy="8" r="6" fill="#15B22C"/>
    <rect x="5.4" y="5.4" width="5.2" height="5.2" rx="1.2" fill="none" stroke="#fff" stroke-width="1.4"/>
  </g>
  <g id="hover-inactive-center" transform="translate(60,0)">
    <rect width="16" height="16" fill="#000" fill-opacity="0"/>
    <circle cx="8" cy="8" r="6" fill="#15B22C"/>
    <rect x="5.4" y="5.4" width="5.2" height="5.2" rx="1.2" fill="none" stroke="#fff" stroke-width="1.4"/>
  </g>
  <g id="pressed-center" transform="translate(80,0)">
    <rect width="16" height="16" fill="#000" fill-opacity="0"/>
    <circle cx="8" cy="8" r="6" fill="#0E7A1E"/>
    <rect x="5.4" y="5.4" width="5.2" height="5.2" rx="1.2" fill="none" stroke="#fff" stroke-width="1.4"/>
  </g>
  <g id="deactivated-center" transform="translate(100,0)">
    <rect width="16" height="16" fill="#000" fill-opacity="0"/>
    <circle cx="8" cy="8" r="6" fill="#3A4030"/>
  </g>
  <g id="deactivated-inactive-center" transform="translate(120,0)">
    <rect width="16" height="16" fill="#000" fill-opacity="0"/>
    <circle cx="8" cy="8" r="6" fill="#3A4030"/>
  </g>
</svg>
