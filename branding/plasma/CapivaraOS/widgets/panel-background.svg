<?xml version="1.0" encoding="UTF-8"?>
<!-- Fundo do painel (barra) do CapivaraOS — nine-patch FrameSvg.
     Retângulo arredondado (r=6), preenchimento #191D14 (levemente mais escuro que
     os menus, para a barra "recuar"), borda 1px #2A3122. Margem de conteúdo 4px.
     FEAT-91 frente D (D4). É a "cara" da barra superior.
     SPDX-License-Identifier: GPL-3.0-or-later
     SPDX-FileCopyrightText: 2026 CapivaraOS Project -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="56" viewBox="0 0 40 56">
  <g id="topleft">
    <path d="M8,0 L6,0 A6,6 0 0 1 0,6 L0,8 L8,8 Z" fill="#2A3122"/>
    <path d="M8,1 L6,1 A5,5 0 0 1 1,6 L1,8 L8,8 Z" fill="#191D14"/>
  </g>
  <g id="top">
    <rect x="12" y="0" width="4" height="8" fill="#191D14"/>
    <rect x="12" y="0" width="4" height="1" fill="#2A3122"/>
  </g>
  <g id="topright">
    <path d="M20,0 L22,0 A6,6 0 0 1 28,6 L28,8 L20,8 Z" fill="#2A3122"/>
    <path d="M20,1 L22,1 A5,5 0 0 1 27,6 L27,8 L20,8 Z" fill="#191D14"/>
  </g>
  <g id="left">
    <rect x="0" y="12" width="8" height="4" fill="#191D14"/>
    <rect x="0" y="12" width="1" height="4" fill="#2A3122"/>
  </g>
  <g id="center">
    <rect x="12" y="12" width="4" height="4" fill="#191D14"/>
  </g>
  <g id="right">
    <rect x="20" y="12" width="8" height="4" fill="#191D14"/>
    <rect x="27" y="12" width="1" height="4" fill="#2A3122"/>
  </g>
  <g id="bottomleft">
    <path d="M0,20 L8,20 L8,28 L6,28 A6,6 0 0 1 0,22 Z" fill="#2A3122"/>
    <path d="M1,20 L8,20 L8,27 L6,27 A5,5 0 0 1 1,22 Z" fill="#191D14"/>
  </g>
  <g id="bottom">
    <rect x="12" y="20" width="4" height="8" fill="#191D14"/>
    <rect x="12" y="27" width="4" height="1" fill="#2A3122"/>
  </g>
  <g id="bottomright">
    <path d="M20,20 L28,20 L28,22 A6,6 0 0 1 22,28 L20,28 Z" fill="#2A3122"/>
    <path d="M20,20 L27,20 L27,22 A5,5 0 0 1 22,27 L20,27 Z" fill="#191D14"/>
  </g>
  <rect id="hint-top-margin" x="12" y="32" width="4" height="4" fill="#000" fill-opacity="0"/>
  <rect id="hint-bottom-margin" x="12" y="40" width="4" height="4" fill="#000" fill-opacity="0"/>
  <rect id="hint-left-margin" x="0" y="48" width="4" height="4" fill="#000" fill-opacity="0"/>
  <rect id="hint-right-margin" x="8" y="48" width="4" height="4" fill="#000" fill-opacity="0"/>
</svg>
